# Dependabot — monthly multi-ecosystem gold baseline (multi-directory)
# https://docs.github.com/en/code-security/how-tos/secure-your-supply-chain/secure-your-dependencies/configuring-multi-ecosystem-updates
# open-pull-requests-limit must live on the multi-ecosystem group (not on updates).
# supporting-probes/ is not listed: its dependencies are part of the experiment definition and
# change only in a major release, alongside a new reference set.
version: 2

multi-ecosystem-groups:
  all-dependencies:
    schedule:
      interval: 'monthly'
    open-pull-requests-limit: 1
    labels:
      - 'dependencies'
      - 'defer-to-later-release'
    assignees:
      - 'jml6m'

updates:
  - package-ecosystem: 'npm'
    directory: '/'
    patterns:
      - '*'
    multi-ecosystem-group: 'all-dependencies'
    versioning-strategy: 'increase'

  - package-ecosystem: 'github-actions'
    directory: '/'
    patterns:
      - '*'
    multi-ecosystem-group: 'all-dependencies'
