# Dependabot: monthly. Which updates group together, which come alone and which never come is
# decided by what each dependency is, so this file changes only when that does.
# - Minor and patch updates of the tooling (dev packages, actions) go together, one PR per
#   ecosystem.
# - Each major comes alone, so a breaking one doesn't hold up the rest. To skip a major that
#   isn't ready (a peer range not caught up, an input that changed), close its PR with
#   `@dependabot ignore this major version` instead of adding an ignore here.
# - The experiment's inputs never come from Dependabot: they change only in a major release,
#   planned by hand with a new reference set. That's the packages that run the experiment, the
#   actions that install the probes' runtimes, and everything in supporting-probes/ (not listed).
version: 2

updates:
  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'monthly'
    versioning-strategy: 'increase'
    labels:
      - 'dependencies'
      - 'defer-to-later-release'
    assignees:
      - 'jml6m'
    groups:
      tooling:
        patterns:
          - '*'
        update-types:
          - 'minor'
          - 'patch'
    ignore:
      - dependency-name: 'tsx'
      - dependency-name: 'esbuild'
      - dependency-name: 'seedrandom'
      - dependency-name: 'yaml'
      # dependency-cruiser 18.x supports TypeScript <7; with 7 installed it cruises no TypeScript files and still passes.
      - dependency-name: 'typescript'
        versions: ['>=7']

  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'monthly'
    labels:
      - 'dependencies'
      - 'defer-to-later-release'
    assignees:
      - 'jml6m'
    groups:
      actions:
        patterns:
          - '*'
        update-types:
          - 'minor'
          - 'patch'
    ignore:
      - dependency-name: 'actions/setup-python'
      - dependency-name: 'ruby/setup-ruby'
      - dependency-name: 'actions/setup-java'
      - dependency-name: 'actions/setup-dotnet'
