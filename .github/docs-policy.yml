# Exact allowlist of markdown files permitted in this public repo. Any tracked
# *.md file not listed here, and not under an exempt_globs path, fails the
# "docs-policy" job in .github/workflows/docs-lint.yml. Widening this list
# requires a PR — this file is CODEOWNERS-gated to @jml6m — so new/renamed
# docs always get a human review, not just an agent's judgment call.
#
# Enforced by: .github/scripts/check-docs-policy.sh

allowed:
  - README.md                              # Public project overview, usage, install instructions
  - AGENTS.md                               # Agent operating instructions (source of truth)
  - CLAUDE.md                                # Thin @AGENTS.md import pointer only
  - SECURITY.md                               # Vulnerability disclosure policy
  - supporting-probes/README.md                # Supporting-probes subproject overview
  - analysis/ECOSYSTEM_RESEARCH.md               # Human-authored research report (the project's actual deliverable)
  - analysis/EXPERIMENT_ANALYSIS.md               # Human-authored research report (the project's actual deliverable)
  - .github/ISSUE_TEMPLATE/bug_report.md
  - .github/ISSUE_TEMPLATE/feature_request.md
  - .github/pull_request_template.md

exempt_globs: []
