name: Test

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ${{ vars.RUNS_ON }}
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ vars.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint
        continue-on-error: true
      - name: Lychee link check
        uses: lycheeverse/lychee-action@v2
        with:
          args: --no-progress --include-fragments --config ./.lychee.toml './**/*.md'
          fail: true
      - name: Markdownlint
        run: |
          npm install -g markdownlint-cli2@0.14.0
          markdownlint-cli2 '**/*.md' '#node_modules' '#supporting-probes/node_modules'

      - name: Create logs directory
        run: mkdir -p logs/local logs/reference

      - name: Test
        run: npm run test

      - name: Verify no writes to reference/ paths
        run: |
          set -euo pipefail
          tracked_changes=$(git diff --no-renames --name-only --diff-filter=AMDR HEAD --)
          untracked_changes=$(git ls-files --others --exclude-standard)
          violations=$(printf '%s\n%s\n' "$tracked_changes" "$untracked_changes" | grep -E '^(reports|logs|supporting-probes/results|data)/reference/' || true)
          if [ -n "$violations" ]; then
            echo "❌ Workflow wrote to reference/ paths. Refusing to upload artifacts."
            echo "$violations"
            exit 1
          fi
          echo "✅ No reference/ writes detected during workflow."

      - name: Upload trace logs
        uses: actions/upload-artifact@v7
        with:
          name: accuracy-trace-logs
          path: |
            logs/local/
            logs/reference/
          if-no-files-found: error
