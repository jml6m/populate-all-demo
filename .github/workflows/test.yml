name: Test

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ${{ vars.RUNS_ON }}
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ vars.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint
        continue-on-error: true

      - name: Create logs directory
        run: mkdir -p logs/local logs/reference

      - name: Test
        run: npm run test

      - name: Verify no writes to reference/ paths
        run: |
          set -euo pipefail
          violations=$(git status --porcelain | awk '{print $2}' | grep -E '^(reports|logs|supporting-probes/results)/reference/' || true)
          if [ -n "$violations" ]; then
            echo "❌ Workflow wrote to reference/ paths. Refusing to upload artifacts."
            echo "$violations"
            exit 1
          fi
          echo "✅ No reference/ writes detected during workflow."

      - name: Upload trace logs
        uses: actions/upload-artifact@v7
        with:
          name: accuracy-trace-logs
          path: |
            logs/local/
            logs/reference/
          if-no-files-found: error
