name: Release

# Maintainer-started release of the main tip.
#   minor: fixes and infrastructure. package.json already carries X.Y.0 from the release PR.
#          Never re-runs the experiment and never touches reference/; tags and releases only.
#   major: the full pipeline. Regenerates results into a new reference/v<N+1>/ set, commits it
#          with the version bump, then tags and releases.
# A real run needs a successful dry run of the same type on the same commit. Steps skip work
# already done, so re-running failed jobs resumes a partial release.
run-name: ${{ inputs.dry_run && 'Release dry run' || 'Release' }} (${{ inputs.release_type }}) from ${{ github.ref_name }}

on:
  workflow_dispatch:
    inputs:
      release_type:
        description: 'Release type'
        required: true
        default: minor
        type: choice
        options:
          - minor
          - major
      dry_run:
        description: 'Dry run: run every check, write nothing'
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      issues: read
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
      DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
      RELEASE_TYPE: ${{ inputs.release_type }}
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      current_major: ${{ steps.version.outputs.current_major }}
      next_major: ${{ steps.version.outputs.next_major }}
      previous_tag: ${{ steps.version.outputs.previous_tag }}
      tag_exists: ${{ steps.state.outputs.tag_exists }}
      milestone: ${{ steps.milestone.outputs.number }}
    steps:
      - name: Only the maintainer releases
        run: |
          if [ "$GITHUB_TRIGGERING_ACTOR" != "jml6m" ]; then
            echo "::error::Only the maintainer can start a release, not ${GITHUB_TRIGGERING_ACTOR}."
            exit 1
          fi

      - name: Only from the default branch tip
        run: |
          if [ "$GITHUB_REF" != "refs/heads/${DEFAULT_BRANCH}" ]; then
            echo "::error::Run this from ${DEFAULT_BRANCH}, not ${GITHUB_REF}."
            exit 1
          fi

      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0

      - name: Release the tip of ${{ github.event.repository.default_branch }}
        run: |
          git fetch --no-tags origin "$DEFAULT_BRANCH"
          TIP="$(git rev-parse "origin/${DEFAULT_BRANCH}")"
          if [ "$TIP" != "$GITHUB_SHA" ]; then
            echo "::error::${DEFAULT_BRANCH} moved to ${TIP} after this run started at ${GITHUB_SHA}. Start a new run."
            exit 1
          fi

      - name: Resolve the version
        id: version
        run: |
          set -euo pipefail
          CURRENT="$(node -p "require('./package.json').version")"
          if ! [[ "$CURRENT" =~ ^([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
            echo "::error::package.json version '${CURRENT}' is not MAJOR.MINOR.PATCH."
            exit 1
          fi
          MAJOR="${BASH_REMATCH[1]}"; MINOR="${BASH_REMATCH[2]}"; PATCH="${BASH_REMATCH[3]}"
          if [ "$RELEASE_TYPE" = "minor" ]; then
            if [ "$PATCH" != "0" ]; then
              echo "::error::A minor release ships package.json as X.Y.0 from its release PR; found ${CURRENT}."
              exit 1
            fi
            TAG="v${CURRENT}"; LINE="v${MAJOR}.${MINOR}"
          else
            TAG="v$((MAJOR + 1)).0.0"; LINE="v$((MAJOR + 1)).0"
          fi
          PREVIOUS="$(git tag --list 'v*' --sort=-v:refname | grep -v -x "$TAG" | head -1 || true)"
          {
            echo "tag=${TAG}"
            echo "line=${LINE}"
            echo "current_major=${MAJOR}"
            echo "next_major=$((MAJOR + 1))"
            echo "previous_tag=${PREVIOUS}"
          } >> "$GITHUB_OUTPUT"
          echo "${RELEASE_TYPE}: ${CURRENT} -> ${TAG} (previous ${PREVIOUS:-none})"

      - name: Tag state
        id: state
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          TAG_EXISTS=false
          if git rev-parse -q --verify "refs/tags/${TAG}" >/dev/null; then
            TAGGED="$(git rev-parse "${TAG}^{commit}")"
            if [ "$RELEASE_TYPE" = "major" ] || [ "$TAGGED" != "$GITHUB_SHA" ]; then
              echo "::error::${TAG} already exists on ${TAGGED}. Tags never move."
              exit 1
            fi
            TAG_EXISTS=true
          fi
          echo "tag_exists=${TAG_EXISTS}" >> "$GITHUB_OUTPUT"

      # The vX.Y milestone must be done. Its `release`-labelled issue tracks the release itself
      # and is closed by the finish job.
      - name: Milestone is done
        id: milestone
        env:
          LINE: ${{ steps.version.outputs.line }}
        run: |
          NUMBER="$(gh api "repos/${GITHUB_REPOSITORY}/milestones?state=all&per_page=100" \
            --jq ".[] | select(.title == \"${LINE}\") | .number")"
          if [ -z "$NUMBER" ]; then
            echo "::notice::No ${LINE} milestone; nothing to close."
            exit 0
          fi
          OPEN="$(gh api "repos/${GITHUB_REPOSITORY}/issues?milestone=${NUMBER}&state=open&per_page=100" \
            --jq '[.[] | select(all(.labels[]; .name != "release")) | "#\(.number) \(.title)"] | .[]')"
          if [ -n "$OPEN" ]; then
            echo "::error::${LINE} still has open issues or PRs:"
            echo "$OPEN"
            exit 1
          fi
          echo "number=${NUMBER}" >> "$GITHUB_OUTPUT"

      - name: A dry run passed on this commit
        if: ${{ !inputs.dry_run }}
        run: |
          WANT="Release dry run (${RELEASE_TYPE})"
          PASSED="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow release.yml --limit 100 \
            --json headSha,conclusion,displayTitle \
            --jq "[.[] | select(.headSha == \"${GITHUB_SHA}\" and .conclusion == \"success\" and (.displayTitle | startswith(\"${WANT}\")))] | length")"
          if [ "$PASSED" -eq 0 ]; then
            echo "::error::No successful ${RELEASE_TYPE} dry run on ${GITHUB_SHA}. Run this workflow with dry_run checked first."
            exit 1
          fi

  minor:
    needs: check
    if: ${{ inputs.release_type == 'minor' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ needs.check.outputs.tag }}
      PREVIOUS: ${{ needs.check.outputs.previous_tag }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0

      - name: Results are unchanged since the last release
        run: |
          if [ -z "$PREVIOUS" ]; then
            echo "::error::No previous release tag to compare against."
            exit 1
          fi
          if ! git diff --quiet "$PREVIOUS" "$GITHUB_SHA" -- \
              reports/reference logs/reference supporting-probes/results/reference data/reference; then
            echo "::error::reference/ changed since ${PREVIOUS}. Only a major release writes results."
            git diff --stat "$PREVIOUS" "$GITHUB_SHA" -- \
              reports/reference logs/reference supporting-probes/results/reference data/reference
            exit 1
          fi
          echo "reference/ is identical to ${PREVIOUS}."

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '22.22.3'
          cache: 'npm'

      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - name: Test
        run: |
          mkdir -p logs/local logs/reference
          npm test

      - name: Tag ${{ needs.check.outputs.tag }}
        if: ${{ !inputs.dry_run && needs.check.outputs.tag_exists != 'true' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" "$GITHUB_SHA" -m "$TAG"
          git push origin "refs/tags/${TAG}"

      - name: GitHub release
        if: ${{ !inputs.dry_run }}
        run: |
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release ${TAG} already exists."
          else
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --verify-tag --title "$TAG" \
              --generate-notes --notes-start-tag "$PREVIOUS"
          fi

  major:
    needs: check
    if: ${{ inputs.release_type == 'major' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval 'db.runCommand({ ping: 1 })'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      # The release commit goes straight to main, so a real major needs the release App's token.
      - name: Mint release App token
        id: app-token
        if: ${{ !inputs.dry_run }}
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2.2.2
        with:
          app-id: ${{ secrets.VERSION_BUMP_APP_ID }}
          private-key: ${{ secrets.VERSION_BUMP_APP_PRIVATE_KEY }}

      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          token: ${{ steps.app-token.outputs.token || github.token }}
          fetch-depth: 0

      - name: Compute next version
        id: version
        env:
          NEXT_MAJOR: ${{ needs.check.outputs.next_major }}
          CURRENT_MAJOR: ${{ needs.check.outputs.current_major }}
        run: |
          {
            echo "current_major=${CURRENT_MAJOR}"
            echo "next_version=v${NEXT_MAJOR}"
            echo "next_tag=v${NEXT_MAJOR}.0.0"
            echo "next_semver=${NEXT_MAJOR}.0.0"
          } >> "$GITHUB_OUTPUT"

      - name: Existence check
        env:
          NEXT: ${{ steps.version.outputs.next_version }}
        run: |
          set -euo pipefail
          fail=0
          for d in "reports/reference/$NEXT" "logs/reference/$NEXT" "supporting-probes/results/reference/$NEXT" "data/reference/$NEXT"; do
            if [ -e "$d" ]; then
              echo "❌ $d already exists. Refusing to overwrite a released version."
              fail=1
            fi
          done
          if [ "$fail" -ne 0 ]; then exit 1; fi
          echo "✅ No existing $NEXT directories."

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '22.22.3'
          cache: 'npm'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.x'
      - uses: ruby/setup-ruby@8e41b362d2589a22a44c1cfa214b3c83052c195b # v1.318.0
        with:
          ruby-version: 'ruby'
      - uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4.8.0
        with:
          distribution: 'temurin'
          java-version: '21'
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: '8.0.x'

      - name: Install root deps
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Lychee link check
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          args: --no-progress --include-fragments --config ./.lychee.toml './**/*.md'
          fail: true
      - name: Markdownlint
        run: |
          npm install -g markdownlint-cli2@0.14.0
          markdownlint-cli2 '**/*.md'
      - name: Build
        run: npm run build
      - name: Test
        run: |
          mkdir -p logs/local logs/reference
          npm test
      - name: Generate datasets
        run: npm run generate
      - name: Run experiment
        run: npm run experiment

      - name: Install probe Node deps
        working-directory: supporting-probes
        run: npm ci
      - name: Install probe Python deps
        working-directory: supporting-probes
        run: pip install sqlalchemy
      - name: Install probe Ruby deps
        working-directory: supporting-probes
        run: gem install activerecord sqlite3 activesupport
      - name: Install probe Java deps
        working-directory: supporting-probes
        run: mvn -q dependency:resolve
      - name: Install probe .NET deps
        working-directory: supporting-probes
        run: dotnet restore EfCoreTest.csproj

      - name: Run all probes
        working-directory: supporting-probes
        env:
          MONGODB_URI: mongodb://localhost:27017/supporting_probe_mongoose
          PROBE_VERBOSE: '1'
        run: npm run probe:all

      - name: Fingerprint check vs previous release
        env:
          CURRENT_MAJOR: ${{ steps.version.outputs.current_major }}
        run: |
          set -euo pipefail
          prev_dir="reports/reference/v$CURRENT_MAJOR"
          if [ ! -d "$prev_dir" ]; then
            echo "✅ No previous release ($prev_dir absent); first release — fingerprint check skipped."
            exit 0
          fi
          latest_local=$(ls -d reports/local/*/ 2>/dev/null | sort | tail -1)
          if [ -z "$latest_local" ]; then
            echo "❌ No reports/local/<run-id>/ found after npm run experiment."
            exit 1
          fi
          new_fp=$(jq -r '.metadata.fingerprint' "$latest_local/experiment-run.json")
          old_fp=$(jq -r '.metadata.fingerprint' "$prev_dir/experiment-run.json")
          if [ "$new_fp" = "$old_fp" ]; then
            echo "❌ Experiment fingerprint matches v$CURRENT_MAJOR ($new_fp)."
            echo "   No experiment-relevant changes since the last release. Aborting."
            exit 1
          fi
          echo "✅ Fingerprint differs from v$CURRENT_MAJOR."
          echo "   Previous: $old_fp"
          echo "   New:      $new_fp"

      - name: Copy artifacts to reference/
        env:
          NEXT: ${{ steps.version.outputs.next_version }}
        run: |
          set -euo pipefail
          mkdir -p "supporting-probes/results/reference/$NEXT"
          latest_probes=$(ls -d supporting-probes/results/local/*/ | sort | tail -1)
          cp -r "$latest_probes"* "supporting-probes/results/reference/$NEXT/"

          mkdir -p "reports/reference/$NEXT"
          latest_reports=$(ls -d reports/local/*/ | sort | tail -1)
          cp -r "$latest_reports"* "reports/reference/$NEXT/"

          mkdir -p "logs/reference/$NEXT"
          latest_logs=$(ls -d logs/local/*/ 2>/dev/null | sort | tail -1 || true)
          if [ -n "$latest_logs" ]; then
            cp -r "$latest_logs"* "logs/reference/$NEXT/" 2>/dev/null || true
          fi

          mkdir -p "data/reference/$NEXT"
          cp data/manifest.json "data/reference/$NEXT/manifest.json"
          for tier_dir in data/*/; do
            tier_name=$(basename "$tier_dir")
            if [ "$tier_name" = "reference" ]; then continue; fi
            mkdir -p "data/reference/$NEXT/$tier_name"
            cp "$tier_dir"*.yaml "data/reference/$NEXT/$tier_name/" 2>/dev/null || true
          done

      - name: Write release manifest
        env:
          NEXT_VERSION: ${{ steps.version.outputs.next_version }}
          NEXT_TAG: ${{ steps.version.outputs.next_tag }}
        run: |
          set -euo pipefail
          root_hash=$(sha256sum package-lock.json | cut -d' ' -f1)
          probes_hash=$(sha256sum supporting-probes/package-lock.json | cut -d' ' -f1)
          latest_reports=$(ls -d reports/local/*/ | sort | tail -1)
          run_id=$(basename "$latest_reports")
          node_v=$(node --version)
          python_v=$(python --version 2>&1 | awk '{print $2}')
          ruby_v=$(ruby --version | awk '{print $2}')
          java_v=$(java --version 2>&1 | head -1 | awk '{print $2}')
          dotnet_v=$(dotnet --version)
          released_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          commit=$(git rev-parse HEAD)
          jq -n \
            --arg version    "$NEXT_VERSION" \
            --arg tag        "$NEXT_TAG" \
            --arg releasedAt "$released_at" \
            --arg commit     "$commit" \
            --arg runId      "$run_id" \
            --arg node       "$node_v" \
            --arg python     "$python_v" \
            --arg ruby       "$ruby_v" \
            --arg java       "$java_v" \
            --arg dotnet     "$dotnet_v" \
            --arg rootHash   "sha256:$root_hash" \
            --arg probesHash "sha256:$probes_hash" \
            '{
              version: $version,
              tag: $tag,
              releasedAt: $releasedAt,
              commit: $commit,
              runId: $runId,
              runtime: { node: $node, python: $python, ruby: $ruby, java: $java, dotnet: $dotnet },
              lockfileHashes: {
                "package-lock.json": $rootHash,
                "supporting-probes/package-lock.json": $probesHash
              }
            }' > "reports/reference/$NEXT_VERSION/manifest.json"
          echo "Manifest written:"
          cat "reports/reference/$NEXT_VERSION/manifest.json"

      - name: Bump package version
        if: ${{ !inputs.dry_run }}
        run: npm version "${{ steps.version.outputs.next_semver }}" --no-git-tag-version --force

      - name: Commit, push and tag
        if: ${{ !inputs.dry_run }}
        env:
          NEXT_VERSION: ${{ steps.version.outputs.next_version }}
          NEXT_TAG: ${{ steps.version.outputs.next_tag }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A package.json package-lock.json \
            "reports/reference/$NEXT_VERSION/" \
            "logs/reference/$NEXT_VERSION/" \
            "supporting-probes/results/reference/$NEXT_VERSION/" \
            "data/reference/$NEXT_VERSION/"
          git commit -m "Release $NEXT_TAG"
          git push origin "HEAD:${{ github.event.repository.default_branch }}"
          git tag -a "$NEXT_TAG" -m "$NEXT_TAG"
          git push origin "refs/tags/${NEXT_TAG}"

      - name: GitHub release
        if: ${{ !inputs.dry_run }}
        env:
          GH_TOKEN: ${{ github.token }}
          NEXT_TAG: ${{ steps.version.outputs.next_tag }}
          PREVIOUS: ${{ needs.check.outputs.previous_tag }}
        run: |
          gh release create "$NEXT_TAG" --repo "$GITHUB_REPOSITORY" --verify-tag --title "$NEXT_TAG" \
            --generate-notes ${PREVIOUS:+--notes-start-tag "$PREVIOUS"}

  finish:
    needs: [check, minor, major]
    if: ${{ always() && !inputs.dry_run && needs.check.result == 'success' && (needs.minor.result == 'success' || needs.major.result == 'success') && needs.check.outputs.milestone != '' }}
    runs-on: ubuntu-24.04
    permissions:
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ needs.check.outputs.tag }}
      MILESTONE: ${{ needs.check.outputs.milestone }}
    steps:
      - name: Close the release issue and the milestone
        run: |
          for n in $(gh api "repos/${GITHUB_REPOSITORY}/issues?milestone=${MILESTONE}&state=open&labels=release&per_page=100" --jq '.[].number'); do
            gh issue close "$n" --repo "$GITHUB_REPOSITORY" --comment "Released as ${TAG}."
          done
          gh api -X PATCH "repos/${GITHUB_REPOSITORY}/milestones/${MILESTONE}" -f state=closed --jq '"Closed milestone \(.title)."'
