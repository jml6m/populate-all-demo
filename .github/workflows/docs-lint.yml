name: Docs Lint

# Runs on every PR and always reports. Do NOT path-filter the trigger: a check that
# never reports blocks a merge like a failing one. Relevance is decided in-job.
on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  docs-lint:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout code
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          # Full history so the relevance diff below compares against the PR's real base.
          fetch-depth: 0

      # Skipped steps still let the job report SUCCESS.
      - name: Check for relevant path changes
        id: changed
        run: |
          set -euo pipefail

          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "relevant=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          diff_range="${{ github.event.pull_request.base.sha }}...${{ github.event.pull_request.head.sha }}"
          if ! changed_files="$(git diff --name-only "$diff_range" --)"; then
            echo "Failed to compute diff for $diff_range; defaulting to relevant=true"
            echo "relevant=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if echo "$changed_files" | grep -qE '\.md$|^\.lychee\.toml$|^\.markdownlint-cli2\.yaml$|^\.github/workflows/.*\.ya?ml$|^scripts/check-agent-file-length\.mjs$|^\.cursorrules$'; then
            echo "relevant=true" >> "$GITHUB_OUTPUT"
          else
            echo "relevant=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Lychee link check
        if: steps.changed.outputs.relevant == 'true'
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          # Fragments via `include_fragments = "full"` in .lychee.toml — no CLI flag.
          # lycheeVersion is pinned explicitly so the config syntax can't drift with the tag.
          args: --no-progress --config ./.lychee.toml './**/*.md'
          lycheeVersion: v0.24.2
          fail: true

      - name: Set up Node.js
        if: steps.changed.outputs.relevant == 'true'
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '22.22.3'

      - name: Install markdownlint-cli2
        if: steps.changed.outputs.relevant == 'true'
        run: npm install -g markdownlint-cli2@0.14.0

      - name: Run markdownlint
        if: steps.changed.outputs.relevant == 'true'
        run: markdownlint-cli2 '**/*.md'

      - name: Agent-instruction file length
        if: steps.changed.outputs.relevant == 'true'
        run: node scripts/check-agent-file-length.mjs

  docs-policy:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout code
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Enforce markdown allowlist
        run: bash .github/scripts/check-docs-policy.sh
