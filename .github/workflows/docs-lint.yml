name: Docs Lint

on:
  pull_request:
    branches:
      - main
    paths:
      - '**/*.md'
      - '.lychee.toml'
      - '.markdownlint-cli2.yaml'
      - '.github/workflows/*.yml'
      - '.github/workflows/*.yaml'
  workflow_dispatch:

jobs:
  docs-lint:
    runs-on: ${{ vars.RUNS_ON }}
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      # Install the pinned lychee binary directly. The lycheeverse/lychee-action
      # install step cannot locate the binary in the v0.24.2 release tarball (it is
      # nested under a lychee-<target>/ directory), so we fetch and install it here.
      - name: Install lychee v0.24.2
        run: |
          set -euo pipefail
          version=0.24.2
          url="https://github.com/lycheeverse/lychee/releases/download/lychee-v${version}/lychee-x86_64-unknown-linux-gnu.tar.gz"
          curl -sfL "$url" -o /tmp/lychee.tar.gz
          tar -xzf /tmp/lychee.tar.gz -C /tmp
          if [ -f /tmp/lychee-x86_64-unknown-linux-gnu/lychee ]; then
            sudo install /tmp/lychee-x86_64-unknown-linux-gnu/lychee /usr/local/bin/lychee
          else
            sudo install /tmp/lychee /usr/local/bin/lychee
          fi
          lychee --version

      - name: Lychee link check
        run: lychee --no-progress --config ./.lychee.toml './**/*.md'

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ vars.NODE_VERSION }}

      - name: Install markdownlint-cli2
        run: npm install -g markdownlint-cli2@0.14.0

      - name: Run markdownlint
        run: markdownlint-cli2 '**/*.md'
