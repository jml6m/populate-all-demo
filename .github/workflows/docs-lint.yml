name: Docs Lint

on:
  pull_request:
    branches:
      - main
    paths:
      - '**/*.md'
      - '.lychee.toml'
      - '.markdownlint-cli2.yaml'
      - '.github/docs-policy.yml'
      - '.github/scripts/check-docs-policy.sh'
      - '.github/workflows/*.yml'
      - '.github/workflows/*.yaml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  docs-lint:
    runs-on: ${{ vars.RUNS_ON }}
    steps:
      - name: Checkout code
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Lychee link check
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          # Fragments via `include_fragments = "full"` in .lychee.toml — no CLI flag.
          # lycheeVersion is pinned explicitly so the config syntax can't drift with the tag.
          args: --no-progress --config ./.lychee.toml './**/*.md'
          lycheeVersion: v0.24.2
          fail: true

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: ${{ vars.NODE_VERSION }}

      - name: Install markdownlint-cli2
        run: npm install -g markdownlint-cli2@0.14.0

      - name: Run markdownlint
        run: markdownlint-cli2 '**/*.md'

  docs-policy:
    runs-on: ${{ vars.RUNS_ON }}
    steps:
      - name: Checkout code
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Enforce markdown allowlist
        run: bash .github/scripts/check-docs-policy.sh
