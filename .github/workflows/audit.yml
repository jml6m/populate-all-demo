name: Audit

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: '.nvmrc'
          cache: npm
      # --ignore-scripts: install the dependency tree for auditing without
      # running postinstall/native builds/husky. The gate hard-fails on
      # critical/high in PRODUCTION deps (dev-only advisories are reported but
      # not gated); since CI is set, offline/registry errors fail rather than skip.
      - run: npm ci --ignore-scripts
      - run: npm run audit:ci
