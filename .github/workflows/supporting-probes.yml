name: Supporting Probes

on:
  pull_request:
    paths:
      - 'supporting-probes/**'
      - '.github/workflows/supporting-probes.yml'
  workflow_dispatch:

env:
  PROBE_VERBOSE: '1'

jobs:
  probes:
    name: Supporting probes
    runs-on: ubuntu-latest
    permissions:
      contents: read
    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval 'db.runCommand({ ping: 1 })'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout code
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Reject any writes to reference/ paths
        run: |
          set -euo pipefail

          # Make canonical reference artifacts read-only in non-release workflows.
          chmod -R a-w supporting-probes/results/reference || true

          # Defensive: ensure local results output cannot resolve under any reference/ path.
          local_results="$(realpath supporting-probes/results/local)"
          if echo "$local_results" | grep -E '(^|/)reference(/|$)' >/dev/null; then
            echo "Unsafe results path resolves under reference/: $local_results"
            exit 1
          fi

          output_probe_path="$PWD/supporting-probes/results/local/__guard__"
          for candidate in "$RUNNER_TEMP" "$output_probe_path"; do
            if echo "$candidate" | grep -E '(^|/)reference(/|$)' >/dev/null; then
              echo "Unsafe path detected under reference/: $candidate"
              exit 1
            fi
          done

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: supporting-probes/package-lock.json

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.x'

      - name: Set up Ruby
        uses: ruby/setup-ruby@8e41b362d2589a22a44c1cfa214b3c83052c195b # v1.318.0
        with:
          ruby-version: 'ruby'

      - name: Set up Java
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4.8.0
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up .NET
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: '8.0.x'

      - name: Install Node dependencies
        working-directory: supporting-probes
        run: npm ci

      - name: Install Python dependencies
        working-directory: supporting-probes
        run: pip install sqlalchemy

      - name: Install Ruby dependencies
        working-directory: supporting-probes
        run: gem install activerecord sqlite3 activesupport

      - name: Install Java dependencies
        working-directory: supporting-probes
        run: mvn -q dependency:resolve

      - name: Install .NET dependencies
        working-directory: supporting-probes
        run: dotnet restore EfCoreTest.csproj

      - name: Run all probes
        working-directory: supporting-probes
        env:
          MONGODB_URI: mongodb://localhost:27017/supporting_probe_mongoose
        run: npm run probe:all

      - name: Verify no writes to reference/ paths
        run: |
          set -euo pipefail
          tracked_changes=$(git diff --no-renames --name-only --diff-filter=AMDR HEAD --)
          untracked_changes=$(git ls-files --others --exclude-standard)
          violations=$(printf '%s\n%s\n' "$tracked_changes" "$untracked_changes" | grep -E '^(reports|logs|supporting-probes/results|data)/reference/' || true)
          if [ -n "$violations" ]; then
            echo "❌ Workflow wrote to reference/ paths. Refusing to upload artifacts."
            echo "$violations"
            exit 1
          fi
          echo "✅ No reference/ writes detected during workflow."

      - name: Upload structured results
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: supporting-probes-results
          path: supporting-probes/results/local/
          if-no-files-found: error
