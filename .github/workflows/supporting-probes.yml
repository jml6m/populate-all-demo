name: Supporting Probes

on:
  workflow_dispatch:

jobs:
  probes:
    name: Supporting probes
    runs-on: ${{ vars.RUNS_ON }}
    permissions:
      contents: read
    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval 'db.runCommand({ ping: 1 })'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Reject any modifications to reference/ paths
        run: |
          set -euo pipefail
          if git ls-files supporting-probes/results/reference/ | xargs -I{} test -f {}; then
            echo "Reference dirs are read-only in non-release workflows"
          fi

          output_probe_path="$PWD/supporting-probes/results/local/__guard__"
          for candidate in "$RUNNER_TEMP" "$output_probe_path"; do
            if echo "$candidate" | grep -E '(^|/)reference(/|$)' >/dev/null; then
              echo "Unsafe path detected under reference/: $candidate"
              exit 1
            fi
          done

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ vars.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: supporting-probes/package-lock.json

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: 'ruby'

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Install Node dependencies
        working-directory: supporting-probes
        run: npm ci

      - name: Install Python dependencies
        working-directory: supporting-probes
        run: pip install sqlalchemy

      - name: Install Ruby dependencies
        working-directory: supporting-probes
        run: gem install activerecord sqlite3 activesupport

      - name: Install Java dependencies
        working-directory: supporting-probes
        run: mvn -q dependency:resolve

      - name: Install .NET dependencies
        working-directory: supporting-probes
        run: dotnet restore EfCoreTest.csproj

      - name: Run all probes
        working-directory: supporting-probes
        env:
          MONGODB_URI: mongodb://localhost:27017/supporting_probe_mongoose
        run: npm run probe:all

      - name: Upload structured results
        uses: actions/upload-artifact@v7
        with:
          name: supporting-probes-results
          path: supporting-probes/results/local/
          if-no-files-found: error
