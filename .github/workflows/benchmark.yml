name: Benchmark

on:
  workflow_dispatch:

jobs:
  benchmark:
    runs-on: ${{ vars.RUNS_ON }}
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ vars.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # Note: issue #6 (O(V²) YAML alias concern) is already mitigated — answer files use the
      # flat index-based AnswerEntry[] format, not cyclic object aliases. The --max-old-space-size
      # flag below addresses the remaining heap pressure from in-memory graph reconstruction.
      - name: Generate test data
        run: npm run generate
        env:
          NODE_OPTIONS: '--max-old-space-size=4096'

      - name: Run benchmark suite
        run: npm run experiment
        env:
          NODE_OPTIONS: '--max-old-space-size=4096'

      - name: Verify no writes to reference/ paths
        run: |
          set -euo pipefail
          tracked_changes=$(git diff --no-renames --name-only --diff-filter=AMDR HEAD --)
          untracked_changes=$(git ls-files --others --exclude-standard)
          violations=$(printf '%s\n%s\n' "$tracked_changes" "$untracked_changes" | grep -E '^(reports|logs|supporting-probes/results)/reference/' || true)
          if [ -n "$violations" ]; then
            echo "❌ Workflow wrote to reference/ paths. Refusing to upload artifacts."
            echo "$violations"
            exit 1
          fi
          echo "✅ No reference/ writes detected during workflow."

      - name: Upload benchmark reports
        uses: actions/upload-artifact@v7
        with:
          name: benchmark-reports
          path: |
            reports/local/
          if-no-files-found: error
