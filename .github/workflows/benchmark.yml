name: Benchmark

on:
  workflow_dispatch:

jobs:
  benchmark:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # Note: issue #6 (O(V²) YAML alias concern) is already mitigated — answer files use the
      # flat index-based AnswerEntry[] format, not cyclic object aliases. The --max-old-space-size
      # flag below addresses the remaining heap pressure from in-memory graph reconstruction.
      - name: Generate test data
        run: npm run generate
        env:
          NODE_OPTIONS: '--max-old-space-size=4096'

      - name: Run benchmark suite
        run: npm run experiment
        env:
          NODE_OPTIONS: '--max-old-space-size=4096'

      - name: Verify no writes to reference/ paths
        run: |
          set -euo pipefail
          tracked_changes=$(git diff --no-renames --name-only --diff-filter=AMDR HEAD --)
          untracked_changes=$(git ls-files --others --exclude-standard)
          violations=$(printf '%s\n%s\n' "$tracked_changes" "$untracked_changes" | grep -E '^(reports|logs|supporting-probes/results|data)/reference/' || true)
          if [ -n "$violations" ]; then
            echo "❌ Workflow wrote to reference/ paths. Refusing to upload artifacts."
            echo "$violations"
            exit 1
          fi
          echo "✅ No reference/ writes detected during workflow."

      - name: Upload benchmark reports
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: benchmark-reports
          path: |
            reports/local/
          if-no-files-found: error
