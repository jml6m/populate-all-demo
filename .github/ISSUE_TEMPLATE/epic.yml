name: Epic (Parent Issue)
description: Track a larger feature or initiative that spans multiple sub-issues.
title: "[Epic]: "
labels: ["epic"]
body:
  - type: markdown
    attributes:
      value: |
        ### 🧭 Epic Guidelines
        - **When to use:** Use an Epic when the work naturally breaks down into **3 or more** distinct sub-issues, or spans multiple repositories/functional areas.
        - **How to use:** 
          1. Create this Parent Epic first.
          2. Draft and create the child issues.
          3. Update the Task List below with the # references to the child issues so GitHub creates the progress tracker (e.g., 0 / 6).
  - type: textarea
    id: description
    attributes:
      label: Epic Description
      description: What is the high-level goal of this epic?
    validations:
      required: true
  - type: textarea
    id: tasks
    attributes:
      label: Task List (Sub-issues)
      description: List the child issues here using markdown checkboxes. Replace the placeholders with actual issue numbers once created.
      value: |
        - [ ] Task 1 (e.g. #123)
        - [ ] Task 2
        - [ ] Task 3
    validations:
      required: true
